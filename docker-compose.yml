# Planilla de Horas — stack de desarrollo (recarga en caliente).
#
# Uso:  docker compose up --build
#       Front  → http://localhost:3000
#       API    → http://localhost:4000/api/v1/health
#
# Para producción usar docker-compose.prod.yml.
# Sin Redis: el código no lo usa.
#
# Antes del primer `up` hace falta un .env en esta carpeta con estas tres
# variables (una por línea, valores distintos y al azar):
#   DB_PASSWORD=...
#   JWT_SECRET=...
#   JWT_REFRESH_SECRET=...
# No hay valores por defecto a propósito: los que había estaban publicados en el
# repositorio, y con el secreto de JWT en la mano cualquiera se firma un token de
# ADMIN contra el stack que los use, sin pasar por el login.
# Si el volumen pgdata ya existía, DB_PASSWORD tiene que ser la misma clave con
# la que se creó (si no, borrarlo: docker volume rm planilla-dev_pgdata).

name: planilla-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: planilla_horas
      POSTGRES_USER: planilla_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo loopback: publicarlo en 0.0.0.0 dejaba la base (nómina, hashes,
      # certificados) alcanzable desde toda la red local sin pasar por la API.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planilla_user -d planilla_horas']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://planilla_user:${DB_PASSWORD:?falta DB_PASSWORD en el .env}@db:5432/planilla_horas
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET en el .env}
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo loopback: el front habla con el API por la red interna de Docker
      # (VITE_PROXY_TARGET), este puerto es únicamente para probar a mano desde
      # la máquina de desarrollo.
      - '127.0.0.1:4000:4000'

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Vacío → el front usa rutas relativas y las resuelve el proxy de Vite
      VITE_API_URL: ''
      VITE_PROXY_TARGET: http://api:4000
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  backups:
