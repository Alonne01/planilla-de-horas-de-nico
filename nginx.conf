# nginx del borde — modo HTTPS con dominio propio.
# Se monta en /etc/nginx/nginx.conf dentro del contenedor `nginx`.
# Para HTTP puro (LAN o Cloudflare Tunnel) usar nginx.http.conf en su lugar.

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 10M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  upstream api { server api:4000; }
  upstream web { server web:3000; }

  # HTTP: solo el desafío de certbot y redirección a HTTPS
  server {
    listen 80;
    server_name PLANILLA_DOMINIO;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name PLANILLA_DOMINIO;

    ssl_certificate     /etc/nginx/certs/live/PLANILLA_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/PLANILLA_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # API REST
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Archivos subidos (fotos de perfil, adjuntos) servidos por el API
    location /uploads/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      expires 7d;
    }

    # Frontend (SPA)
    location / {
      proxy_pass http://web;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
