# Config del nginx interno que sirve el build estático del frontend.
# No termina TLS ni conoce el API: de eso se encarga el nginx del borde.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets con hash en el nombre → cacheables para siempre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index nunca se cachea: es lo que apunta a los assets nuevos tras un deploy
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA: cualquier ruta de react-router cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
