# Config del nginx interno que sirve el build estático del frontend.
# No termina TLS ni conoce el API: de eso se encarga el nginx del borde.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Política de contenido. Se arma en una variable porque `add_header` dentro de
  # un location descarta las cabeceras del nivel server, así que hay que repetir
  # el bloque en cada location que agrega cabeceras propias.
  #
  # Por qué cada permiso (sacarlos rompe la app):
  #   script-src 'unsafe-inline' → index.html trae dos scripts inline (el tema
  #     antes de que cargue React y el registro del service worker) que Vite no
  #     hashea. Endurecible a 'self' + hashes recién cuando salgan del index.
  #   style-src 'unsafe-inline' + fonts.googleapis.com → Tailwind y Radix
  #     inyectan estilos inline, y el index carga la tipografía Inter de Google.
  #   img-src data: blob: → íconos SVG embebidos, avatares y las descargas que se
  #     arman en memoria (XLSX/PDF con createObjectURL).
  #   connect-src api.argentinadatos.com → refresco de feriados nacionales
  #     (planillaHelpers.ts); el resto de las llamadas van al mismo origen.
  set $csp_planilla "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.argentinadatos.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  add_header Content-Security-Policy $csp_planilla always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Assets con hash en el nombre → cacheables para siempre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy $csp_planilla always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
  }

  # El index nunca se cachea: es lo que apunta a los assets nuevos tras un deploy
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Content-Security-Policy $csp_planilla always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # SPA: cualquier ruta de react-router cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
