# nginx del borde — modo HTTP puro.
# Para dos escenarios:
#   1. Uso solo en la red interna (se entra por http://IP-del-servidor).
#   2. Detrás de Cloudflare Tunnel / Tailscale Funnel: el TLS lo termina el túnel
#      y hasta acá llega tráfico HTTP dentro de la máquina.
#
# NO exponer este modo directamente a internet: las credenciales viajarían en claro.
# Activar con NGINX_CONF=./nginx.http.conf en el .env.

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 10M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  upstream api { server api:4000; }
  upstream web { server web:3000; }

  server {
    listen 80 default_server;
    server_name _;

    # Desafío de Let's Encrypt: permite emitir el primer certificado estando
    # todavía en modo HTTP, antes de pasar a nginx.conf.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Sin `expires`: acá pasan certificados médicos y el API los marca como
    # privados; un Cache-Control público los dejaría cacheados en el camino.
    location /uploads/ {
      proxy_pass http://api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host            $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
