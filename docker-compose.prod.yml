# Planilla de Horas — stack de producción.
#
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Requiere un archivo .env en esta misma carpeta (ver .env.docker.example).
#
# Perfiles opcionales:
#   --profile certbot   → emite/renueva certificados Let's Encrypt
#   --profile tunnel    → publica vía Cloudflare Tunnel (sin abrir puertos)
#
# Nota: no hay servicio Redis. El código no lo usa (no figura en las
# dependencias del API ni se referencia en src/); levantarlo solo gastaba RAM.

name: planilla

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: planilla_horas
      POSTGRES_USER: planilla_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin `ports`: la base solo es alcanzable desde la red interna de Docker.
    # Para conectarse con pgAdmin/DBeaver, usar un túnel SSH contra el servidor.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planilla_user -d planilla_horas']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: planilla-api:latest
    restart: always
    environment:
      DATABASE_URL: postgresql://planilla_user:${DB_PASSWORD}@db:5432/planilla_horas
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET en .env}
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${PUBLIC_URL:?falta PUBLIC_URL en .env}
      CORS_ORIGINS: ${PUBLIC_URL}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # Email de notificaciones (opcional): descomentar y completar en .env
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASS: ${SMTP_PASS}
      # SMTP_FROM: ${SMTP_FROM}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: planilla-web:latest
    restart: always
    # El front llama al API con rutas relativas (/api/v1/...) y las resuelve el
    # nginx del borde, así que la imagen no depende del dominio.

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # NGINX_CONF define el modo de publicación:
      #   ./nginx.conf       → HTTPS con certificados propios (dominio + certbot)
      #   ./nginx.http.conf  → HTTP puro (LAN interna o detrás de Cloudflare Tunnel)
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - web

  # Emisión y renovación de certificados (solo con --profile certbot).
  # No corre en segundo plano: se invoca a demanda con `run --rm`.
  #   Emitir:   docker compose -f docker-compose.prod.yml --profile certbot run --rm certbot \
  #               certonly --webroot -w /var/www/certbot -d TU.DOMINIO --agree-tos -m TU_EMAIL
  #   Renovar:  docker compose -f docker-compose.prod.yml --profile certbot run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  # Dirección fija gratuita (solo con --profile duckdns).
  # Mantiene actualizado el registro de DuckDNS con la IP pública del servidor,
  # así https://TU-SUBDOMINIO.duckdns.org sigue funcionando aunque el proveedor
  # de internet cambie la IP. Requiere los puertos 80/443 abiertos en el router.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ['duckdns']
    restart: always
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:?falta DUCKDNS_SUBDOMAIN en .env}
      TOKEN: ${DUCKDNS_TOKEN:?falta DUCKDNS_TOKEN en .env}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      UPDATE_IP: ipv4
      LOG_FILE: 'false'

  # Publicación sin abrir puertos del router (solo con --profile tunnel)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx

volumes:
  pgdata:
  uploads:
  backups:
  certbot-www:
